[package]
name = "anndata-memory"
version = "0.1.2-alpha.0"
edition = "2021"
readme = "README.md"
repository = "https://github.com/SingleRust/Anndata-Memory"
description = "Thread-safe AnnData-like structure for single-cell genomics data in Rust. Provides controlled mutability, efficient memory management, and flexible data manipulation. Ideal for concurrent bioinformatics applications."
include = [
    "**/*.rs",
    "Cargo.toml",
]
license-file = "LICENSE.md"

[dependencies]
anyhow = "1.0"
flate2 = "1.0"
log = "0.4"
indexmap = { version = "2.6", features = ["rayon"] }
itertools = "0.13"
ndarray = { version = "0.16" }
nalgebra-sparse = "0.10"
num = "0.4"
polars = { version = "0.45", features = ["lazy", "decompress-fast", "ndarray", "dtype-full"] }
parking_lot = "0.12"
replace_with = "0.1"
smallvec = "1.13"
rayon = "1.10"
permutation = "0.4"
anndata = "0.6.1"
anndata-hdf5 = "0.5.0"


[dev-dependencies]
tempfile = "3.14.0"
proptest = "1.6.0"
rand = "0.8.5"
ndarray-rand = "0.15.0"
nalgebra = { version = "0.33.2", features = ["rand"] }